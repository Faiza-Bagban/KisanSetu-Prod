name: Backend CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: kisansetu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-mar tesseract-ocr-hin poppler-utils libgl1

      - name: Install CPU-only torch
        run: pip install torch==2.11.0 torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Re-pin CPU-only torch/torchvision (prevent easyocr from overriding)
        run: pip install --force-reinstall torch==2.11.0 torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Seed CI database
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/kisansetu_ci
        run: python seed_db.py

      - name: Run backend tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/kisansetu_ci
        run: pytest tests/ -v --ignore=tests/test_eligibility.py